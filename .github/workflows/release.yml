name: Release
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test and package universal macOS binary
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./release "${RELEASE_TAG#v}"
      - name: Upload complete release and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=${RELEASE_TAG#v}
          existing=$(gh release list --limit 1000 --json tagName,isDraft --jq ".[] | select(.tagName == \"$RELEASE_TAG\") | .isDraft")
          if [ "$existing" = false ]; then
            echo 'This release is already published; release assets are immutable.' >&2
            exit 1
          fi
          if [ "$existing" != true ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "cooked $version" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "dist/$version/cooked" "dist/$version/install" \
            "dist/$version/manifest.json" "dist/$version/SHA256SUMS" --clobber
          release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -F draft=false -f make_latest=legacy --silent
